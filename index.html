<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Malen">
<title>Malen</title>
<style>
:root{--bg:#fff3c9;--bar:#ffe08a;--ink:#2b2b2b}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;touch-action:none;background:var(--bg);font-family:"Chalkboard SE","Comic Sans MS","Marker Felt",system-ui,sans-serif}
body{display:flex;height:100dvh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#tools{display:grid;grid-template-columns:repeat(3,64px);grid-auto-rows:64px;gap:10px;padding:12px;background:var(--bar);align-content:center;justify-content:center}
#main{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px;padding:12px}
#wrap{flex:1;min-height:0;container-type:size;display:flex;justify-content:center;align-items:center}
#box{width:min(100cqw,100cqh);aspect-ratio:1;position:relative;background:#fff;border-radius:18px;box-shadow:0 0 0 6px #fff,0 0 0 9px #e0a526;overflow:hidden}
#box canvas{position:absolute;inset:0;width:100%;height:100%}
#o{pointer-events:none}
#motifs{display:flex;gap:10px;overflow-x:auto;touch-action:pan-x;padding:4px 4px 10px;scrollbar-width:none}
#motifs::-webkit-scrollbar{display:none}
#motifs>*{flex:none}
#motifs>:first-child{margin-left:auto}
#motifs>:last-child{margin-right:auto}
button{border:0;font:inherit;cursor:pointer;touch-action:manipulation}
.t,.m{width:64px;height:64px;border-radius:50%;background:#fff;font-size:32px;display:flex;align-items:center;justify-content:center;padding:0;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.m{border-radius:18px}
.c{box-shadow:inset 0 0 0 3px rgba(0,0,0,.12),0 4px 0 rgba(0,0,0,.18)}
.on{outline:6px solid var(--ink);outline-offset:2px}
.w{background:conic-gradient(#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)}
.w span{width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 0 0 3px #fff;display:block}
#wp{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:10}
#wp[hidden]{display:none}
#wc{width:min(70vmin,380px);height:min(70vmin,380px);background:#fff;border-radius:50%;box-shadow:0 0 0 10px #fff;touch-action:none}
.dot{border-radius:50%;background:var(--ink);display:block}
#clear{transition:transform 1.2s linear}
#clear.hold{transform:scale(.7);background:#ffb3b3}
#pimg{display:none}
@media (orientation:portrait){
 body{flex-direction:column}
 #main{order:1}
 #tools{order:2;grid-template-columns:repeat(auto-fill,64px);grid-auto-rows:64px}
}
@media print{
 @page{margin:12mm}
 body>*:not(#pimg){display:none!important}
 html,body{overflow:visible;height:auto;background:#fff}
 #pimg{display:block;width:100%;max-width:180mm;margin:0 auto}
}
</style>
</head>
<body>
<div id="tools"></div>
<div id="main">
 <div id="wrap"><div id="box"><canvas id="p" width="1000" height="1000"></canvas><canvas id="o" width="1000" height="1000"></canvas></div></div>
 <div id="motifs"></div>
</div>
<div id="wp" hidden><canvas id="wc" width="520" height="520"></canvas></div>
<img id="pimg" alt="">
<script>
const S=1000,COLORS=['#e53935','#fb8c00','#fdd835','#43a047','#1e88e5','#8e24aa','#ec407a','#795548','#fde0cc','#e8b88a','#b97a4b','#6b4226','#212121'];
const p=document.getElementById('p'),o=document.getElementById('o'),pc=p.getContext('2d'),oc=o.getContext('2d');
let color=COLORS[0],size=30,erase=false;
pc.fillStyle='#fff';pc.fillRect(0,0,S,S);

// Werkzeuge
const tools=document.getElementById('tools');
function btn(cls,html,fn){const b=document.createElement('button');b.className=cls;b.innerHTML=html;b.onclick=fn;tools.appendChild(b);return b}
const cb=COLORS.map(c=>{const b=btn('t c','',()=>{color=c;erase=false;mark()});b.style.background=c;return b});
const wb=btn('t c w','<span></span>',openWheel);
const eb=btn('t','🧽',()=>{erase=true;mark()});
const sb=btn('t','<i class="dot" style="width:14px;height:14px"></i>',()=>{size=14;mark()});
const lb=btn('t','<i class="dot" style="width:36px;height:36px"></i>',()=>{size=40;mark()});
const vb=btn('t','💾',doSave);
const pb=btn('t','🖨️',doPrint);
const xb=btn('t','🗑️',()=>{});xb.id='clear';
function mark(){
 cb.forEach((b,i)=>b.classList.toggle('on',!erase&&COLORS[i]===color));
 eb.classList.toggle('on',erase);
 wb.classList.toggle('on',!erase&&!COLORS.includes(color));
 sb.classList.toggle('on',size===14);lb.classList.toggle('on',size===40);
}
size=40;mark();

// Farbrad: Mitte hell, Rand dunkel, rundherum die Farbtöne
const wp=document.getElementById('wp'),wc=document.getElementById('wc'),wx=wc.getContext('2d');
let wdrawn=false;
function hsl(h,s,l){const a=s*Math.min(l,1-l),f=n=>{const k=(n+h/30)%12;return l-a*Math.max(-1,Math.min(k-3,9-k,1))};return[f(0),f(8),f(4)].map(v=>Math.round(v*255))}
function drawWheel(){
 const N=wc.width,R=N/2,im=wx.createImageData(N,N),d=im.data;
 for(let y=0;y<N;y++)for(let x=0;x<N;x++){
  const dx=x+.5-R,dy=y+.5-R,r=Math.hypot(dx,dy)/R,i=(y*N+x)*4;if(r>1)continue;
  const h=(Math.atan2(dy,dx)*180/Math.PI+360)%360,c=hsl(h,1,.97-.94*r);
  d[i]=c[0];d[i+1]=c[1];d[i+2]=c[2];d[i+3]=255;
 }
 wx.putImageData(im,0,0);
}
function openWheel(){if(!wdrawn){drawWheel();wdrawn=true}wp.hidden=false}
function pickWheel(e){
 const r=wc.getBoundingClientRect(),x=Math.floor((e.clientX-r.left)*wc.width/r.width),y=Math.floor((e.clientY-r.top)*wc.height/r.height);
 if(x<0||y<0||x>=wc.width||y>=wc.height)return;
 const d=wx.getImageData(x,y,1,1).data;if(!d[3])return;
 color='rgb('+d[0]+','+d[1]+','+d[2]+')';erase=false;wb.firstChild.style.background=color;mark();
}
wc.addEventListener('pointerdown',e=>{wc.setPointerCapture(e.pointerId);pickWheel(e)});
wc.addEventListener('pointermove',e=>{if(e.buttons)pickWheel(e)});
wc.addEventListener('pointerup',()=>{wp.hidden=true});
wp.addEventListener('pointerdown',e=>{if(e.target===wp)wp.hidden=true});

// Gedrückt halten zum Löschen
let hold;
xb.onpointerdown=()=>{xb.classList.add('hold');hold=setTimeout(()=>{pc.fillStyle='#fff';pc.fillRect(0,0,S,S);xb.classList.remove('hold');later()},1200)};
['pointerup','pointerleave','pointercancel'].forEach(e=>xb.addEventListener(e,()=>{clearTimeout(hold);xb.classList.remove('hold')}));

// Zeichnen
let last=null;
function pos(e){const r=p.getBoundingClientRect();return[(e.clientX-r.left)*S/r.width,(e.clientY-r.top)*S/r.height]}
function seg(a,b){
 pc.strokeStyle=erase?'#fff':color;pc.lineWidth=erase?size*2:size;
 pc.lineCap=pc.lineJoin='round';
 pc.beginPath();pc.moveTo(a[0],a[1]);pc.lineTo(b[0],b[1]);pc.stroke();
}
const box=document.getElementById('box');
box.addEventListener('pointerdown',e=>{e.preventDefault();box.setPointerCapture(e.pointerId);last=pos(e);seg(last,[last[0]+.01,last[1]])});
box.addEventListener('pointermove',e=>{if(!last)return;const n=pos(e);seg(last,n);last=n});
['pointerup','pointercancel'].forEach(t=>box.addEventListener(t,()=>{last=null;later()}));
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('contextmenu',e=>e.preventDefault());

// Ausmalbilder (Koordinaten 0–100)
const ci=(c,x,y,r)=>{c.beginPath();c.arc(x,y,r,0,7);c.stroke()};
const el=(c,x,y,rx,ry)=>{c.beginPath();c.ellipse(x,y,rx,ry,0,0,7);c.stroke()};
const pl=(c,pts)=>{c.beginPath();pts.forEach((q,i)=>i?c.lineTo(q[0],q[1]):c.moveTo(q[0],q[1]));c.closePath();c.stroke()};
const MOTIFS=[
 {e:'☀️',f:c=>{ci(c,50,50,16);for(let i=0;i<12;i++){const a=i*Math.PI/6,P=(r,d)=>[50+r*Math.cos(a+d),50+r*Math.sin(a+d)];pl(c,[P(21,-.2),P(21,.2),P(38,0)])}}},
 {e:'🏠',f:c=>{pl(c,[[20,48],[80,48],[80,88],[20,88]]);pl(c,[[14,48],[50,14],[86,48]]);pl(c,[[43,62],[57,62],[57,88],[43,88]]);pl(c,[[25,56],[37,56],[37,68],[25,68]]);pl(c,[[63,56],[75,56],[75,68],[63,68]]);pl(c,[[68,32],[68,20],[78,20],[78,38]])}},
 {e:'🐟',f:c=>{el(c,45,50,30,20);pl(c,[[72,50],[94,30],[94,70]]);ci(c,32,44,3.5);pl(c,[[40,32],[52,16],[60,34]]);pl(c,[[40,68],[50,82],[58,66]])}},
 {e:'🌸',f:c=>{for(let i=0;i<6;i++){const a=i*Math.PI/3;ci(c,50+17*Math.cos(a),38+17*Math.sin(a),8.5)}ci(c,50,38,8);pl(c,[[48,58],[52,58],[52,92],[48,92]]);el(c,66,76,13,6);el(c,34,70,13,6)}},
 {e:'❤️',f:c=>{c.beginPath();c.moveTo(50,86);c.bezierCurveTo(8,55,14,12,50,34);c.bezierCurveTo(86,12,92,55,50,86);c.closePath();c.stroke()}},
 {e:'🦋',f:c=>{ci(c,33,36,16);ci(c,67,36,16);ci(c,36,66,12);ci(c,64,66,12);ci(c,30,36,6);ci(c,70,36,6);el(c,50,50,4,22);c.beginPath();c.moveTo(48,29);c.lineTo(40,14);c.moveTo(52,29);c.lineTo(60,14);c.stroke();ci(c,40,13,2);ci(c,60,13,2)}},
 {e:'🌳',f:c=>{el(c,50,38,30,26);pl(c,[[43,62],[57,62],[57,92],[43,92]]);ci(c,40,32,4);ci(c,58,44,4);ci(c,62,28,4)}},
 {e:'🚗',f:c=>{pl(c,[[8,62],[8,50],[26,46],[36,28],[66,28],[78,46],[92,50],[92,62]]);pl(c,[[40,32],[49,32],[49,45],[32,45]]);pl(c,[[53,32],[64,32],[73,45],[53,45]]);ci(c,28,66,10);ci(c,72,66,10);ci(c,28,66,4);ci(c,72,66,4)}},
 {e:'🐱',f:c=>{ci(c,50,56,26);pl(c,[[28,40],[30,16],[44,32]]);pl(c,[[72,40],[70,16],[56,32]]);ci(c,40,52,4);ci(c,60,52,4);pl(c,[[47,60],[53,60],[50,64]]);c.beginPath();[[26,62,8,58],[26,66,8,68],[74,62,92,58],[74,66,92,68]].forEach(l=>{c.moveTo(l[0],l[1]);c.lineTo(l[2],l[3])});c.stroke()}},
 {e:'⭐',f:c=>{const q=[];for(let i=0;i<10;i++){const r=i%2?16:38,a=-Math.PI/2+i*Math.PI/5;q.push([50+r*Math.cos(a),52+r*Math.sin(a)])}pl(c,q)}},
 {e:'🍄',f:c=>{c.beginPath();c.ellipse(50,50,36,30,0,Math.PI,0);c.closePath();c.stroke();pl(c,[[40,50],[60,50],[64,86],[36,86]]);ci(c,36,38,5);ci(c,52,30,6);ci(c,66,42,5)}},
 {e:'🐢',f:c=>{c.beginPath();c.ellipse(50,56,32,24,0,Math.PI,0);c.closePath();c.stroke();ci(c,88,52,8);ci(c,90,50,1.5);pl(c,[[30,56],[40,56],[38,72],[28,72]]);pl(c,[[60,56],[70,56],[72,72],[62,72]]);pl(c,[[18,56],[8,60],[18,62]]);ci(c,50,44,9);ci(c,34,52,6);ci(c,66,52,6)}},
 {e:'📄',f:null}
];
const ms=document.getElementById('motifs');
MOTIFS.forEach((m,i)=>{
 const b=document.createElement('button');b.className='m';b.textContent=m.e;
 b.onclick=()=>{
  pc.fillStyle='#fff';pc.fillRect(0,0,S,S);
  oc.clearRect(0,0,S,S);
  if(m.f){oc.setTransform(10,0,0,10,0,0);oc.lineWidth=1;oc.strokeStyle='#222';oc.lineJoin=oc.lineCap='round';m.f(oc);oc.setTransform(1,0,0,1,0,0)}
  [...ms.children].forEach(x=>x.classList.remove('on'));b.classList.add('on');later();
 };
 ms.appendChild(b);
});
// Eigenes Bild laden (bleibt auf dem Gerät)
const fi=document.createElement('input');fi.type='file';fi.accept='image/*';fi.hidden=true;document.body.appendChild(fi);
const lb2=document.createElement('button');lb2.className='m';lb2.textContent='📂';lb2.onclick=()=>fi.click();ms.appendChild(lb2);
fi.onchange=()=>{
 const f=fi.files[0];if(!f)return;
 const im=new Image(),u=URL.createObjectURL(f);
 im.onload=()=>{
  const t=document.createElement('canvas');t.width=t.height=S;const x=t.getContext('2d');
  x.fillStyle='#fff';x.fillRect(0,0,S,S);
  const k=Math.min(S/im.width,S/im.height),w=im.width*k,h=im.height*k;
  x.drawImage(im,(S-w)/2,(S-h)/2,w,h);
  const d=x.getImageData(0,0,S,S),a=d.data;
  for(let i=0;i<a.length;i+=4){
   const l=.299*a[i]+.587*a[i+1]+.114*a[i+2];
   a[i+3]=l>=215?0:l<=100?255:(215-l)*255/115;
   a[i]=a[i+1]=a[i+2]=34;
  }
  oc.setTransform(1,0,0,1,0,0);oc.clearRect(0,0,S,S);oc.putImageData(d,0,0);
  pc.fillStyle='#fff';pc.fillRect(0,0,S,S);
  [...ms.children].forEach(b=>b.classList.remove('on'));later();
  URL.revokeObjectURL(u);
 };
 im.onerror=()=>URL.revokeObjectURL(u);
 im.src=u;fi.value='';
};
// Automatisch speichern (im Browser des Geräts) und wiederherstellen
let st;
function later(){clearTimeout(st);st=setTimeout(save,600)}
function save(){try{localStorage.setItem('malen-v1',JSON.stringify({p:p.toDataURL('image/jpeg',.85),o:o.toDataURL('image/png')}))}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});
let s=null;try{s=JSON.parse(localStorage.getItem('malen-v1'))}catch(e){}
if(s&&s.p&&s.o){const a=new Image(),b=new Image();let n=0;
 const go=()=>{if(++n===2){pc.drawImage(a,0,0);oc.drawImage(b,0,0)}};
 a.onload=b.onload=go;a.src=s.p;b.src=s.o}
else ms.children[1].click();

// Als Bild sichern (Teilen-Menü → "Bild sichern" legt es in Fotos ab)
function doSave(){
 const t=document.createElement('canvas');t.width=t.height=S;const x=t.getContext('2d');
 x.drawImage(p,0,0);x.drawImage(o,0,0);
 t.toBlob(bl=>{
  const f=new File([bl],'malbild.png',{type:'image/png'});
  if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f]}).catch(()=>{})}
  else{const a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download='malbild.png';a.click()}
 },'image/png');
}

// Drucken
function doPrint(){
 const t=document.createElement('canvas');t.width=t.height=S;const x=t.getContext('2d');
 x.drawImage(p,0,0);x.drawImage(o,0,0);
 const img=document.getElementById('pimg');
 img.src=t.toDataURL('image/png');
 setTimeout(()=>window.print(),200);
}
</script>
</body>
</html>
